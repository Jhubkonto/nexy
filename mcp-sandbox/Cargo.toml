[package]
name = "mcp-sandbox"
version = "0.1.0"
edition = "2021"
description = "Fail-closed OS boundary for Nexy's third-party MCP servers"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
